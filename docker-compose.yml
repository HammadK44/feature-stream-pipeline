services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loans
    ports:
      - "5432:5432"
    volumes:
      - ./data/de_test_task_db:/docker-entrypoint-initdb.d/de_test_task_db
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
