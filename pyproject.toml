[project]
name = "feature-stream-pipeline"
version = "0.1.0"
description = "Polling-based data pipeline from Postgres to S3 with per-client features."
authors = [
    { name = "Hammad Khalid", email = "hammadbink@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "psycopg2-binary>=2.9,<3.0",
    "pyarrow>=17.0,<19.0",
    "boto3>=1.34,<2.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.5,<3.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "feat_stream"
module-root = "src"
